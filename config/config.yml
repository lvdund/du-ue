logging:
  level: "info"

du:
  id: 1
  name: "DU-UE-Simulator"
  cucp_address: "192.168.10.3"
  cucp_port: 38472
  local_address: "192.168.10.1"
  local_port: 0
  plmn:
    mcc: "001"
    mnc: "01"
  cell:
    pci: 1
    tac: "000001"

ue:
  nue: 1
  msin: "0000000001"
  key: "465B5CE8B199B49FAA5F0A2EE238A6BC"
  opc: "E8ED289DEBA952E4283B54E88E6183CA"
  amf: "8000"
  plmn:
    mcc: "001"
    mnc: "01"

  scenarios:
    - name: "basic_registration"
      description: "Register UE and establish default PDU session"
      apply_to: "all"
      events:
        - type: "registration"
          delay: "2s"

        - type: "pdu_establishment"
          delay: "5s"
          params:
            dnn: "internet"

        # Commented out: PDU sessions won't complete without CU-CP fix
        # (CU-CP needs to include UEContextRequest in NGAP InitialUEMessage)
        # - type: "pdu_release"
        #   delay: "30s"

        - type: "deregistration"
          delay: "10s"