logging:
  level: "info"

du:
  id: 1
  name: "DU-UE-Simulator"
  cucp_address: "192.168.1.2"
  cucp_port: 38472
  local_address: "192.168.1.2"
  local_port: 38473
  plmn:
    mcc: "208"
    mnc: "93"
  cell:
    pci: 1
    tac: "000001"

ue:
  nue: 10
  msin: "0000000001"
  key: "8baf473f2f8fd09487cccbd7097c6862"
  opc: "b9912fce303952b8e4af328992d3d497"
  amf: "8000"
  plmn:
    mcc: "208"
    mnc: "93"

  scenarios:
    - name: "basic_registration"
      description: "Register UE and establish default PDU session"
      apply_to: "all"
      events:
        - type: "registration"
          delay: "2s"

        - type: "pdu_establishment"
          delay: "5s"
          params:
            dnn: "internet"

        - type: "pdu_release"
          delay: "30s"

        - type: "deregistration"
          delay: "32s"